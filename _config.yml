plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  excerpt_only: true
  posts_limit: 50  # above the post count (script/check-plugin-output.rb checks); excerpts only, so the feed stays small

# NOTE: the Google/Naver site-verification HTML files are intentionally NOT
# excluded — they must be served at the site root, or Search Console / Naver
# lose ownership verification of the property.
exclude:
  - /vendor/
  - README.md
  - README.ko.md
  - docs/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  # Diagram sources and their render script are authoring inputs, not site
  # assets. Without these they get copied into _site and served publicly.
  - "**/*.excalidraw"
  - "**/*.drawio"
  - assets/images/render-diagrams.sh
  # The READMEs' banner; the site itself uses my_header_image.jpg.
  - assets/my_header_image_full.jpg
  - script/
  - test/

title: Bits, Bytes and Neural Networks
subtitle: A Data Scientist's Digital Playground
email: aldente0630@gmail.com
# The site's author: jekyll-feed's Atom <author> and head.html's author meta and
# JSON-LD. Posts never set `author` themselves — paper posts use `paper_author`.
author: Jonas Kim
# The site's default language: the feed's xml:lang. Pages and posts still set
# their own `lang`; a post without one is in this language.
lang: ko
# Every date shown on a page (post meta, home, tags, category lists) uses this, so
# one page cannot say "29 May 2023" while another says "May 29, 2023".
date_format: "%B %-d, %Y"
# `>-` (folded, chomped) not `|` — a literal block keeps the trailing newline,
# which then leaks into meta content="" attributes and the feed <subtitle>.
description: >-
  A tech blog focusing on AI/ML paper reviews and latest research trends
baseurl: ''
url: https://bits-bytes-nn.github.io
# Post URLs embed :year/:month/:day, and front-matter dates carry no offset, so
# without this Jekyll resolves them in the *build machine's* timezone. CI runs in
# UTC while local machines here run in KST (+9), so a local build would move
# afternoon-dated posts onto the next day and 404 their live URLs. Pinned to UTC
# because every published URL was built that way.
timezone: UTC
# Build posts dated later than the build. Insights posts are dated 12:00 on their
# day (21:00 KST), so a same-day merge in the Korean morning would deploy
# without the post, and nothing rebuilds the site later. Nothing is scheduled.
future: true
# Slugified, so "Paper Reviews" becomes paper-reviews/ rather than the
# space-escaped paper%20reviews/ that plain `:categories` produces. Posts first
# published under the old form redirect from it — see _plugins/legacy_urls.rb.
permalink: /:slugified_categories/:year/:month/:day/:title:output_ext
redirect_from:
  json: false  # no consumer for the redirects.json index
cover: /assets/my_header_image.jpg
logo: /assets/my_logo.png

# No css/main.css.map in the published site; it only maps to the Sass sources,
# which are not published either.
sass:
  sourcemap: never

# An unknown filter is an error, not a silent pass-through: without this a
# plugin filter that fails to register renders its input (a whole post body
# under "Read time") and every gate stays green.
liquid:
  strict_filters: true

markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: true
  parse_span_html: true
  smart_quotes: ["apos", "apos", "quot", "quot"]
  syntax_highlighter: rouge
  math_engine: mathjax

# The ownership-verification tokens must ship (see `exclude` above) but are not
# pages anyone should be sent to, so they stay out of sitemap.xml.
defaults:
  - scope: { path: "google*.html" }
    values: { sitemap: false }
  - scope: { path: "naver*.html" }
    values: { sitemap: false }

paginate: 5
paginate_path: /page/:num/

ga_tracking_id: G-MRH9Z5ETSQ

social:
  # Contact: GitHub - LinkedIn - Threads (in order)
  - name: GitHub
    icon: github
    username: bits-bytes-nn
    url: https://github.com/bits-bytes-nn
    desc: Fork me on GitHub
    share: false

  # Share only (no url = not shown in Contact)
  - name: Facebook
    icon: facebook
    share: true
    share_url: https://www.facebook.com/sharer.php
    share_params:
      - key: t
        value: TITLE
      - key: u
        value: URL

  - name: LinkedIn
    icon: linkedin
    username: Jonas Kim
    url: https://www.linkedin.com/in/aldente0630
    desc: Connect with me on LinkedIn
    share: true
    share_url: https://www.linkedin.com/shareArticle
    share_params:
      - key: mini
        value: true
      - key: url
        value: URL

  # Share only (no url = not shown in Contact)
  - name: X
    icon: x-twitter
    share: true
    share_url: https://twitter.com/share
    share_params:
      - key: text
        value: TITLE
      - key: url
        value: URL

  - name: Threads
    icon: threads
    username: aldente0630
    url: https://www.threads.com/@aldente0630
    desc: Follow me on Threads
    share: false


protocols:
  # Default social card image, used only when a page sets no `cover`. The old
  # value was my_logo.png declared as 612x605 — the file is actually 192x192,
  # below the 200x200 floor Facebook/LinkedIn need to render a card at all.
  # my_header_image.jpg is the site cover and its declared size is real.
  fb_image: /assets/my_header_image.jpg
  fb_image_width: 1920
  fb_image_height: 600
  fb_image_type: image/jpeg
