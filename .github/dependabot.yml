version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
  # The gems only run in CI (build, html-proofer), but html-proofer pulls in
  # nokogiri, which gets security releases.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # 3.x is dart-sass, which rejects the vendored Bourbon/Neat `/` division;
      # the Gemfile pins ~> 2.0 for that reason.
      - dependency-name: jekyll-sass-converter
        versions: [">= 3"]
    groups:
      gems-minor-and-patch:
        update-types:
          - minor
          - patch
