# Post conventions, as data.
#
# The one list of the values a post's front matter may use, and of the MathJax
# macros head.html defines (math, below). script/lint-posts.rb checks every
# post's front matter against it, in CI before the build, and scholar-lens
# reads this same file before it opens a pull request here, so a
# generated post and a hand-written one answer to the same rules. The prose
# conventions (README.md "Writing a post", docs/tech-doc.md) point here instead
# of repeating the lists.

# categories[0]. `paper`: the post reviews one paper, so it names the paper's
# organisation in `paper_author`, and may give the paper's DOI in `paper_doi`
# (10.48550/arXiv.<id> when the paper is on arXiv, else the venue's DOI)
# for the citation count in the post's meta panel; no other type may set it.
# Paper Surveys walk one topic through several papers in the order they came
# out, so no single paper's keys apply. `cover`: the image every post of the
# type uses; without one, the topic's image below.
types:
  Paper Reviews: { paper: true }
  Paper Summaries: { paper: true }
  Paper Surveys: {}
  Tech Guides: {}
  Insights: { cover: /assets/images/insights.jpg }

# categories[1], with the cover a post of that topic uses unless its type brings
# its own (Insights). With neither, any image that exists in the repo will do.
topics:
  Language-Models: /assets/images/language-models.jpg
  Multimodal-Learning: /assets/images/multimodal-learning.jpg
  Finetuning: /assets/images/finetuning.jpg
  Retrieval-Augmented-Generation: /assets/images/retrieval-augmented-generation.jpg
  Agentic-AI: /assets/images/agentic-ai.jpg
  Data-Architecture: /assets/images/data-architecture.jpg

# Never in front matter. jekyll-feed reads `author` as the entry's author, which
# is the site's (see _config.yml); a paper's authors go in `paper_author`.
# `last_modified_at` comes from a file-name date later than `date:`
# (_plugins/posted_date.rb).
forbidden_keys: [author, last_modified_at]

# `lang` values. A translation is one post in each, sharing a translation_id;
# the language switcher (_includes/language_switcher.html) knows these two.
languages: [ko, en]

math:
  # The macros _includes/head.html defines for MathJax on top of the standard
  # set; test/test_lint_posts.rb fails when the two lists differ.
  defined_macros: [llbracket, rrbracket, textsc]

tags:
  # Every post carries at least one: it is what _plugins/related_posts.rb joins
  # posts on. A tag only one paper can have connects nothing.
  controlled:
    - Agentic-AI
    - Alignment
    - DeepSeek
    - Efficient-Attention
    - Knowledge-Graph
    - Llama
    - MLOps
    - Mixture-of-Experts
    - Model-Serving
    - Multimodal-Models
    - Parameter-Efficient-Fine-Tuning
    - Quantization
    - Reasoning-Models
    - Retrieval-Augmented-Generation
  # Lowercase inside a tag, as in a title: Leiden-Algorithm-for-Text.
  lowercase_words: [a, an, and, as, at, by, for, from, in, of, "on", or, the, to, via, vs, with]
  # Retired names and the tag that replaced each. A post may not use the old one.
  aliases:
    Mixture-of-Experts-Architecture: Mixture-of-Experts
    Sparse-Mixture-of-Experts: Mixture-of-Experts
    Sparse-Mixture-of-Experts-Architecture: Mixture-of-Experts
    Efficient-Mixture-of-Experts-Architecture: Mixture-of-Experts
    DeepSeekMoE-Architecture: DeepSeekMoE
    Verifiable-Rewards-Reinforcement-Learning: Reinforcement-Learning-with-Verifiable-Rewards
    Interleaving-Local-Global-Attention: Interleaved-Local-Global-Attention
    Alternating-Local-Global-Attention: Interleaved-Local-Global-Attention
    Natively-Multimodal-Transformer-Architecture: Natively-Multimodal-Transformer
    Long-Chain-of-Thought-Cold-Start-Integration: Long-Chain-of-Thought-Cold-Start
    Reinforcement-Learning-with-Cold-Start: Long-Chain-of-Thought-Cold-Start
    Group-Relative-Policy-Optimization-Scaling: Group-Relative-Policy-Optimization
    Rejection-Sampling-and-Supervised-Fine-Tuning: Rejection-Sampling-Fine-Tuning
    Scaling-Laws-for-Large-Language-Models: Scaling-Laws
    Language-Model-Scaling-Laws: Scaling-Laws
