<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">

  {% include head.html %}

  <body>
    <!-- A dozen focusable elements sit before <main> on every page (logo, menu
         button, the nav links, theme toggle), and a long post then leads with a
         copy button per code block. Screen readers can jump by landmark; sighted
         keyboard users had no shortcut. -->
    <a class="skip-link" href="#main-content">Skip to content</a>

    {% include header.html %}

    <main class="page-content" id="main-content">
      {{ content }}
    </main>

    {% include footer.html %}
  </body>

</html>
