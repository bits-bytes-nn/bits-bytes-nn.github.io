<header class="navigation" role="banner" lang="{{ site.ui_lang }}">
	<div class="navigation-wrapper">
		<a href="{{ site.baseurl }}/" class="logo">
			{% if site.logo %}
			<!-- loading="eager" is the opt-out documented in _plugins/lazy_images.rb.
			     The header is position: fixed; top: 0, so this is the one image on the
			     site that is always in the initial viewport — without this the plugin
			     lazy-loads it and the logo paints late on every page. -->
			<img
				loading="eager"
				src="{{ site.logo | prepend: site.baseurl }}"
				alt="{{ site.title }}"
			/>
			{% else %}
			<span>{{ site.title }}</span>
			{% endif %}
		</a>
		<button type="button" id="js-mobile-menu" class="navigation-menu-button"
			aria-label="Menu" aria-expanded="false" aria-controls="js-navigation-menu">
			{% include icon.html name="bars" %}
		</button>
		<nav role="navigation" aria-label="Main">
			<ul id="js-navigation-menu" class="navigation-menu">
				{% include nav_links.html %}
				<li class="nav-link theme-toggle-item">
					<button type="button" id="theme-toggle" class="theme-toggle"
						aria-label="Dark mode" title="Dark mode">
						<span class="theme-icon-light">{% include icon.html name="moon" %}</span><span class="theme-icon-dark">{% include icon.html name="sun" %}</span>
					</button>
				</li>
			</ul>
		</nav>
	</div>
</header>
